; ESP32-S3: UART0 on the pads that the chip has for it (GPIO43 TX, GPIO44 RX: the console of the ROM)
; The pads of any UART can be chosen with tx_pin / rx_pin / rts_pin / cts_pin (the GPIO matrix routes them).
[main]
driver_order=0

[dmuart]
instance=0
baudrate=115200
databits=8
parity=none
stopbits=1
rx_ring_size=256
rx_ring_wait_mode=some_data
