; Elecrow DIS08070H (CrowPanel ESP32 HMI 7.0", ESP32-S3-WROOM-1-N4R8): the console, UART0 on the pads of the ROM's console
; (GPIO43 TX, GPIO44 RX) that the USB-UART bridge of the board (CH340, the USB-C connector, /dev/ttyUSB0 on the host) is wired to.
; The chip's own USB-Serial/JTAG is not wired to a connector. 921600 8N1: the bridge keeps up with it (the 40 MHz crystal divides to
; 930 kB/s, 1 % off); the ROM's boot messages are at 115200, so they are garbage at this rate.
[main]
driver_order=0

[dmuart]
instance=0
baudrate=921600
databits=8
parity=none
stopbits=1
rx_ring_size=256
rx_ring_wait_mode=some_data
